name: Deploy — production

# Story 0.12 — SSH-based deploy to DigitalOcean droplet `tukio-apps`.
# Tag-driven release; `production` GitHub Environment requires manual approval.
#
# For MVP we share the apps droplet between staging and production (single
# environment, ~€29/mo budget). The `production` environment gate gives us
# the manual approval step we'd otherwise get from a separate cluster.
# Smoke-fail triggers automatic rollback to the previous tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy (e.g. v1.2.3)'
        required: true

concurrency:
  group: deploy-production-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  DO_HOST_APPS: ${{ secrets.DO_HOST_APPS }}
  DO_DEPLOY_KEY: ${{ secrets.DO_DEPLOY_KEY }}
  SLACK_WEBHOOK_DEPLOYS_PROD: ${{ secrets.SLACK_WEBHOOK_DEPLOYS_PROD }}
  PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL || 'https://api.tukio.one/health' }}

jobs:
  ssh-deploy:
    name: SSH deploy — tukio-apps (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tukio.one
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — required secrets present
        run: |
          missing=()
          [ -z "${DO_HOST_APPS}" ] && missing+=("DO_HOST_APPS")
          [ -z "${DO_DEPLOY_KEY}" ] && missing+=("DO_DEPLOY_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup SSH key + known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${DO_DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H "${DO_HOST_APPS}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${{ github.ref_name }}"
          fi
          if [[ ! "${REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9] ]]; then
            echo "::error::Production deploy requires a vX.Y.Z tag (got '${REF}')"
            exit 1
          fi
          # Guard against shell injection via tag name — only alphanumerics, dots, dashes.
          if [[ ! "${REF}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Tag '${REF}' contains invalid characters"
            exit 1
          fi
          echo "image_tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${REF}"

      - name: Snapshot previous tag (for rollback)
        id: previous
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 tukio@"${DO_HOST_APPS}" \
            'grep -E "^IMAGE_TAG=" /home/tukio/tukio-apps/.env.production 2>/dev/null | cut -d= -f2 || echo ""')
          echo "previous_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag (for rollback): ${PREV:-<none>}"

      - name: SCP compose + Caddyfile to droplet
        run: |
          scp -i ~/.ssh/id_ed25519 \
            infra/docker-compose/apps.prod.yml \
            infra/docker-compose/Caddyfile \
            tukio@"${DO_HOST_APPS}":~/tukio-apps/

      - name: Remote pull + up
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 tukio@"${DO_HOST_APPS}" bash -se <<EOF
            set -euo pipefail
            cd ~/tukio-apps
            # Persist the deployed tag so the next release can read it for rollback.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.production || \\
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env.production
            export DB_USER=\$(cat /home/tukio/tukio/secrets/pg_user)
            export DB_PASSWORD=\$(cat /home/tukio/tukio/secrets/pg_password)
            export MEILI_MASTER_KEY=\$(cat /home/tukio/tukio/secrets/meili_key)
            export IMAGE_TAG="${IMAGE_TAG}"
            BACKENDS="caddy gateway-api identity-svc catalog-svc booking-svc \\
                      order-svc payment-svc messaging-svc review-svc \\
                      notification-svc media-svc \\
                      public seller admin"
            docker compose -f apps.prod.yml --env-file .env.production pull \$BACKENDS
            # Don't --wait : backend healthchecks need migrated DB schema (Epic 1).
            # Smoke test against PRODUCTION_HEALTH_URL is the real check + triggers rollback on fail.
            docker compose -f apps.prod.yml --env-file .env.production up -d \\
              --remove-orphans \$BACKENDS
            docker compose -f apps.prod.yml --env-file .env.production ps
            # Caddy doesn't auto-reload on Caddyfile changes; trigger explicitly.
            echo "── reload Caddy config..."
            docker exec tukio-apps-caddy-1 caddy reload --config /etc/caddy/Caddyfile || \\
              echo "WARN: caddy reload failed (was it running?)"
          EOF

      - name: Smoke test (production health URL)
        run: |
          for i in $(seq 1 18); do
            if curl -fsS --max-time 5 "${PRODUCTION_HEALTH_URL}" >/dev/null; then
              echo "::notice::Healthcheck OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production healthcheck did not become green within 3 min at ${PRODUCTION_HEALTH_URL}"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.previous.outputs.previous_tag != ''
        env:
          PREV_TAG: ${{ steps.previous.outputs.previous_tag }}
        run: |
          echo "::warning::Smoke test failed — rolling back to ${PREV_TAG}"
          ssh -i ~/.ssh/id_ed25519 tukio@"${DO_HOST_APPS}" bash -se <<EOF
            set -euo pipefail
            cd ~/tukio-apps
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV_TAG}|" .env.production
            export DB_USER=\$(cat /home/tukio/tukio/secrets/pg_user)
            export DB_PASSWORD=\$(cat /home/tukio/tukio/secrets/pg_password)
            export MEILI_MASTER_KEY=\$(cat /home/tukio/tukio/secrets/meili_key)
            export IMAGE_TAG="${PREV_TAG}"
            BACKENDS="caddy gateway-api identity-svc catalog-svc booking-svc \\
                      order-svc payment-svc messaging-svc review-svc \\
                      notification-svc media-svc \\
                      public seller admin"
            docker compose -f apps.prod.yml --env-file .env.production pull \$BACKENDS
            docker compose -f apps.prod.yml --env-file .env.production up -d \\
              --remove-orphans \$BACKENDS
            echo "── reload Caddy config after rollback..."
            docker exec tukio-apps-caddy-1 caddy reload --config /etc/caddy/Caddyfile || \\
              echo "WARN: caddy reload failed during rollback"
          EOF
          echo "::warning::Rolled back to ${PREV_TAG}"

      - name: Smoke test (post-rollback verification)
        if: failure() && steps.previous.outputs.previous_tag != ''
        run: |
          echo "Verifying rollback health..."
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "${PRODUCTION_HEALTH_URL}" >/dev/null; then
              echo "::notice::Rollback verified — healthcheck OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Rollback failed — production is still unhealthy after 2 min"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Notify Slack — success
        if: success() && env.SLACK_WEBHOOK_DEPLOYS_PROD != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_DEPLOYS_PROD }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: Production deploy succeeded — tag `${{ steps.tag.outputs.image_tag }}`"
            }

      - name: Notify Slack — failure
        if: failure() && env.SLACK_WEBHOOK_DEPLOYS_PROD != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_DEPLOYS_PROD }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: Production deploy FAILED — tag `${{ steps.tag.outputs.image_tag }}` (rollback: `${{ steps.previous.outputs.previous_tag }}`) — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
