name: Deploy — staging

# Story 0.12 — SSH-based deploy to DigitalOcean droplet `tukio-apps`.
# Triggers automatically on a successful Build Images run for `develop`,
# or manually via workflow_dispatch.

on:
  workflow_run:
    workflows: ['Build Images']
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  DO_HOST_APPS: ${{ secrets.DO_HOST_APPS }}
  DO_DEPLOY_KEY: ${{ secrets.DO_DEPLOY_KEY }}
  SLACK_WEBHOOK_DEPLOYS: ${{ secrets.SLACK_WEBHOOK_DEPLOYS }}
  STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'https://api.tukio.one/health' }}

jobs:
  ssh-deploy:
    name: SSH deploy — tukio-apps
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://app.tukio.one
    timeout-minutes: 15
    steps:
      - name: Guard — required secrets present
        run: |
          missing=()
          [ -z "${DO_HOST_APPS}" ] && missing+=("DO_HOST_APPS")
          [ -z "${DO_DEPLOY_KEY}" ] && missing+=("DO_DEPLOY_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Configure them in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DO_DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DO_HOST_APPS}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Resolve image tag
        id: tag
        run: |
          # Manual dispatch defaults to the current branch SHA; workflow_run carries the head SHA.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "image_tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: sha-${SHA::7}"

      - name: Remote pull + restart
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          ssh -o StrictHostKeyChecking=yes tukio@"${DO_HOST_APPS}" bash -se <<EOF
            set -euo pipefail
            cd /home/tukio/tukio
            export IMAGE_TAG="${IMAGE_TAG}"
            echo "── pulling images at tag \${IMAGE_TAG}..."
            docker compose -f infra/docker-compose/apps.prod.yml pull
            echo "── restarting stack..."
            docker compose -f infra/docker-compose/apps.prod.yml up -d --remove-orphans
            echo "── waiting for healthy state..."
            docker compose -f infra/docker-compose/apps.prod.yml ps
          EOF

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "${STAGING_HEALTH_URL}" >/dev/null; then
              echo "::notice::Healthcheck OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging healthcheck did not become green within 5 min at ${STAGING_HEALTH_URL}"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Notify Slack — success
        if: success() && env.SLACK_WEBHOOK_DEPLOYS != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_DEPLOYS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: Staging deploy succeeded — tag `${{ steps.tag.outputs.image_tag }}`"
            }

      - name: Notify Slack — failure
        if: failure() && env.SLACK_WEBHOOK_DEPLOYS != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_WEBHOOK_DEPLOYS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: Staging deploy FAILED — tag `${{ steps.tag.outputs.image_tag }}` — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
