name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  actions: read

# Turborepo Remote Cache (Vercel) and Codecov upload were intentionally
# dropped for MVP — costs unjustified at this stage. Local GHA `actions/cache@v4`
# is sufficient for caching; coverage is collected as job artifact (Jest output).
# To re-enable later, see `docs/ci-cd/turborepo-remote-cache.md` and
# `docs/ci-cd/codecov.md` (both marked DEFERRED for V1+).

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # docs-only — short-circuit for documentation-only PRs. Reports green on
  # the required `CI success` check so branch protection passes without
  # running the full pipeline. Mirrors the structure of the regular flow
  # exactly so the check name aggregator sees an outcome.
  # ────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD^1' }}"
          if ! git diff --name-only "$BASE_REF" HEAD \
            | grep -Ev '^(.+\.md|docs/|_bmad/|_bmad-output/|\.github/CODEOWNERS$)' \
            | grep -q .; then
            echo "Documentation / BMad / metadata only — skipping code jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────
  # setup — warms pnpm + turbo caches, exposes the pnpm store path for
  # downstream jobs to reuse via dynamic key (avoids hardcoded path drift).
  # ────────────────────────────────────────────────────────────────────────
  setup:
    name: Setup workspace
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pnpm-store: ${{ steps.pnpm-store.outputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint (affected)
    needs: [changes, setup]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.ref_name }}-
      - run: pnpm install --frozen-lockfile
      - name: Run lint (affected only)
        run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
      - name: Lint eslint-plugin-tukio rules
        run: pnpm --filter=eslint-plugin-tukio test

  typecheck:
    name: Typecheck (affected)
    needs: [changes, setup]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.ref_name }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}

  test:
    name: Unit + integration tests (affected)
    needs: [changes, setup]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.ref_name }}-
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage (affected)
        run: pnpm turbo run test:cov ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build (affected)
    needs: [changes, setup]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.ref_name }}-
      - name: Restore Next.js build cache (4 apps)
        uses: actions/cache@v4
        with:
          path: |
            apps/public/.next/cache
            apps/customer/.next/cache
            apps/seller/.next/cache
            apps/admin/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/**/next.config.*', 'pnpm-lock.yaml') }}
          restore-keys: nextjs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}

  # ────────────────────────────────────────────────────────────────────────
  # e2e — backend integration tests against docker-compose.test.yml.
  # Runs only when a backend service or shared package is affected (heuristic
  # via Turborepo --dry-run). Each affected `*-svc` / `gateway-api` package
  # runs its own `pnpm test:e2e`. Keycloak readiness comes from the compose
  # healthcheck waited on by `pnpm docker:test:up:slow --wait`.
  # ────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E backend tests
    needs: [changes, setup]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: ${{ needs.setup.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.ref_name }}-
      - run: pnpm install --frozen-lockfile
      - name: Detect affected backend services
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            DRY_RUN=$(pnpm turbo run test --dry-run=json "--filter=...[origin/${BASE_REF}]" 2>/dev/null || echo '{"tasks":[]}')
          else
            DRY_RUN=$(pnpm turbo run test --dry-run=json 2>/dev/null || echo '{"tasks":[]}')
          fi
          : "${DRY_RUN:='{"tasks":[]}'}"
          AFFECTED=$(printf '%s' "$DRY_RUN" \
            | node -e '
              let j; try { j = JSON.parse(require("fs").readFileSync(0, "utf8")); } catch { j = { tasks: [] }; }
              const out = (j.tasks||[]).map(t=>t.package).filter(p=>/(-svc$|^gateway-api$)/.test(p));
              console.log([...new Set(out)].join(" "));
            ' || echo "")
          echo "Affected backend services: ${AFFECTED:-<none>}"
          echo "services=${AFFECTED}" >> "$GITHUB_OUTPUT"
      - name: Skip — no affected backend service
        if: steps.affected.outputs.services == ''
        run: echo "::notice::No backend service affected — skipping e2e."
      - name: Start test infra (--wait waits for compose healthchecks)
        if: steps.affected.outputs.services != ''
        run: pnpm docker:test:up:slow
      - name: Run e2e for affected services
        if: steps.affected.outputs.services != ''
        run: |
          for svc in ${{ steps.affected.outputs.services }}; do
            [ -z "$svc" ] && continue
            echo "::group::e2e — $svc"
            pnpm --filter="$svc" test:e2e
            echo "::endgroup::"
          done
      - name: Tear down test infra
        if: always() && steps.affected.outputs.services != ''
        run: pnpm docker:test:down

  # ────────────────────────────────────────────────────────────────────────
  # ci-success — single required check for branch protection. Reports green
  # for docs-only PRs (changes.code == 'false') and aggregates the code path.
  # ────────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI success
    if: always()
    needs: [changes, lint, typecheck, test, build, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only — short-circuit green
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only change — CI skipped."
      - name: Verify all required jobs passed
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
