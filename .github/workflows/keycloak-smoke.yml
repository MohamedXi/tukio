name: Keycloak Realm Smoke Tests

# Runs on every PR so the required `smoke-gate` job always reports a status.
# The expensive `smoke` job is gated to Keycloak-touching changes via the
# `changes` job (same git-diff convention as ci.yml `Detect change scope`).
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request: {}

jobs:
  changes:
    name: Detect Keycloak scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      keycloak: ${{ steps.filter.outputs.keycloak }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # schedule / workflow_dispatch have no PR base → always run the smoke.
          BASE_REF="${{ github.event.pull_request.base.sha || '' }}"
          if [ -z "$BASE_REF" ]; then
            echo "keycloak=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE_REF" HEAD \
            | grep -Eq '^(infra/keycloak/|infra/scripts/bootstrap-keycloak-realm\.sh|infra/scripts/smoke-test-keycloak-realm\.sh|infra/scripts/build-keycloak-themes\.sh|infra/docker-compose/docker-compose\.dev\.yml|\.github/workflows/keycloak-smoke\.yml)'; then
            echo "keycloak=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-Keycloak change — skipping smoke (gate will pass)."
            echo "keycloak=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Keycloak realm smoke (8 tests)
    needs: changes
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Start Keycloak stack
        run: docker compose -f infra/docker-compose/docker-compose.dev.yml up -d keycloak postgres --wait
        env:
          COMPOSE_ANSI: never

      - name: Wait for Keycloak to be healthy
        run: |
          for i in $(seq 1 18); do
            if curl -fsS http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "Keycloak ready (attempt $i)"
              break
            fi
            [ "$i" -eq 18 ] && { echo "Keycloak not ready after 90s" >&2; exit 1; }
            sleep 5
          done

      - name: Build Keycloak themes
        run: bash infra/scripts/build-keycloak-themes.sh

      - name: Bootstrap realm
        run: bash infra/scripts/bootstrap-keycloak-realm.sh --env=local --skip-phasetwo-webhook

      - name: Run smoke tests
        run: bash infra/scripts/smoke-test-keycloak-realm.sh --env=local

      - name: Check realm-export drift
        run: |
          # Stash the committed file before regenerating from the live realm
          cp infra/keycloak/realm-export/tukio.realm.json /tmp/committed.realm.json
          bash infra/scripts/bootstrap-keycloak-realm.sh --env=local --export-only --skip-phasetwo-webhook
          # Normalize both (drop _comment meta, sort keys) — P-L3
          python3 - <<'PYEOF'
          import json
          for src, dst in [
              ('/tmp/committed.realm.json', '/tmp/committed.norm.json'),
              ('infra/keycloak/realm-export/tukio.realm.json', '/tmp/fresh.norm.json'),
          ]:
              d = json.load(open(src))
              for k in ('_comment', '_realm'):
                  d.pop(k, None)
              with open(dst, 'w') as f:
                  json.dump(d, f, sort_keys=True, indent=2)
          PYEOF
          if diff -u /tmp/committed.norm.json /tmp/fresh.norm.json > /tmp/realm-diff.txt; then
            echo "✅ No realm-export drift"
          else
            echo "❌ realm-export drift detected — run 'pnpm keycloak:export' locally and commit infra/keycloak/realm-export/tukio.realm.json"
            head -200 /tmp/realm-diff.txt
            exit 1
          fi

      - name: Upload themes JAR artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tukio-keycloak-themes
          path: dist/tukio-keycloak-themes.jar
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.dev.yml down -v

  # Required status check. Always runs (even when `smoke` is skipped for
  # non-Keycloak PRs) so a path-filtered job can safely gate `develop` without
  # blocking unrelated PRs. Passes when smoke succeeded OR was skipped; fails
  # only when smoke actually failed/was cancelled.
  smoke-gate:
    name: Keycloak smoke gate
    needs: [changes, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Gate on smoke result
        run: |
          result="${{ needs.smoke.result }}"
          echo "smoke job result: ${result}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "✅ Keycloak smoke gate passed (smoke: ${result})"
          else
            echo "❌ Keycloak smoke gate failed (smoke: ${result})"
            exit 1
          fi
