codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: '70...90'

  # Per-workspace granular thresholds (AC8 + Critical Constraint #5).
  # The default `project.target: auto` keeps a non-regressing aggregate
  # baseline; per-flag entries enforce the spec-mandated per-workspace
  # targets (NFR71).
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
        only_pulls: false
      contracts:
        target: 95%
        threshold: 1%
        flags: [contracts]
      messaging:
        target: 80%
        threshold: 1%
        flags: [messaging]
      auth:
        target: 85%
        threshold: 1%
        flags: [auth]
      auth-client:
        target: 85%
        threshold: 1%
        flags: [auth-client]
      api-client:
        target: 80%
        threshold: 1%
        flags: [api-client]
      i18n-client:
        target: 80%
        threshold: 1%
        flags: [i18n-client]
      testing:
        target: 70%
        threshold: 1%
        flags: [testing]
      ui:
        target: 80%
        threshold: 1%
        flags: [ui]
      # Backend services — layered targets per Pattern Pretre.
      # `domain`/`usecases`/`infrastructure` split achieved via path-scoped
      # flags below (one flag per service-layer combination).
      backend-domain:
        target: 80%
        threshold: 2%
        flags: [backend-domain]
      backend-usecases:
        target: 70%
        threshold: 2%
        flags: [backend-usecases]
      backend-infrastructure:
        target: 50%
        threshold: 2%
        flags: [backend-infrastructure]
      # Frontend Next.js apps — pragmatic MVP target.
      frontend:
        target: 60%
        threshold: 2%
        flags: [frontend]

    patch:
      default:
        target: 80%
        threshold: 5%
      contracts:
        target: 95%
        flags: [contracts]
      packages:
        target: 85%
        flags: [contracts, messaging, auth, auth-client, api-client, i18n-client, testing, ui]
      backend:
        target: 70%
        flags: [backend-domain, backend-usecases, backend-infrastructure]
      frontend:
        target: 80%
        flags: [frontend]

# Per-flag (per-workspace) granular paths. Codecov uses POSIX-style regex
# in `paths:` — `apps/.*-svc/` matches the 10 backend services correctly
# (shell glob `apps/*-svc/` would not).
flags:
  contracts:
    paths: [packages/contracts/]
    carryforward: true
  messaging:
    paths: [packages/messaging/]
    carryforward: true
  auth:
    paths: [packages/auth/]
    carryforward: true
  auth-client:
    paths: [packages/auth-client/]
    carryforward: true
  api-client:
    paths: [packages/api-client/]
    carryforward: true
  i18n-client:
    paths: [packages/i18n-client/]
    carryforward: true
  testing:
    paths: [packages/testing/]
    carryforward: true
  ui:
    paths: [packages/ui/]
    carryforward: true
  backend-domain:
    paths:
      - apps/.*-svc/src/domain/
      - apps/gateway-api/src/domain/
    carryforward: true
  backend-usecases:
    paths:
      - apps/.*-svc/src/usecases/
      - apps/gateway-api/src/usecases/
    carryforward: true
  backend-infrastructure:
    paths:
      - apps/.*-svc/src/infrastructure/
      - apps/gateway-api/src/infrastructure/
    carryforward: true
  frontend:
    paths:
      - apps/public/
      - apps/customer/
      - apps/seller/
      - apps/admin/
    carryforward: true

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Files Codecov ignores when computing coverage. Bootstrap files (main.ts,
# index.ts) are intentionally NOT in this list — they wire critical setup
# (Sentry init, envelope filter registration) that should be covered.
ignore:
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.e2e-spec.ts'
  - '**/__tests__/**'
  - '**/test/**'
  - '**/dist/**'
  - '**/.next/**'
  - '**/coverage/**'
  - '**/*.stories.tsx'
  - '**/*.d.ts'
  - 'apps/*/test/**'
  - 'infra/**'
  - 'tools/**'
  - '_bmad/**'
  - '_bmad-output/**'
  - 'docs/**'
